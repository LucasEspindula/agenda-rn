name: Perseu PGlite diagnostic (temporary)
on:
  push:
    branches:
      - fix/rn-integra-stabilization-20261023
permissions:
  contents: read
jobs:
  reproduce_pglite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reproduce isolated PGlite rollback
        run: node --test --test-name-pattern="Perseu replace RPC rolls back" tests/perseu.test.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=1024
