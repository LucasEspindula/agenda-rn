name: Validate receipt confirmation modal
on:
  push:
    branches:
      - fix/modal-confirmar-recebimento-layout-20261021
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/receipt-confirmation-layout.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
