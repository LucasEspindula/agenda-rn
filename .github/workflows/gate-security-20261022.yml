name: Gate patched dependencies and core roles
on:
  push:
    branches: [audit/rn-integra-full-review-20261022]
    paths:
      - .github/workflows/gate-security-20261022.yml
      - package.json
      - package-lock.json
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: node --test tests/audit-five-context-role-matrix.test.mjs tests/audit-agenda-persistence-security.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
