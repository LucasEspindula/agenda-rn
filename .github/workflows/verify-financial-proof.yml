name: Validate financial proof changes
on:
  push:
    branches:
      - feat/refinar-financeiro-agenda-excluir-comprovante-20261020
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check public/legacy-app.js
      - run: node --test tests/payment-proof-removal-agenda-layout.test.mjs
      - run: npx tsc --noEmit
