name: Verify receipt modal in browser
on:
  push:
    branches:
      - fix/confirmacao-recebimento-estilos-isolados-20261021
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/receipt-confirmation-layout.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Run browser visual checks
        run: |
          npm run dev > /tmp/receipt-next.log 2>&1 &
          node tests/receipt-modal-browser-visual-check.mjs || (tail -n 100 /tmp/receipt-next.log; exit 1)
