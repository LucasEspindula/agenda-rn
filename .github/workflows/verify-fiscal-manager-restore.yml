name: Validate fiscal manager approval
on:
  push:
    branches:
      - feat/fiscal-manager-approval-and-restore-20261020
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/fiscal-manager-all-actions-and-restore.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
